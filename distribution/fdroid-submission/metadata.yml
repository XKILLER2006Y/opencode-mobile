Builds:
  - versionName: 0.4.12
    versionCode: 39
    commit: v0.4.12
    subdir: android/app
    sudo:
      - apt-get update
      - apt-get install npm
    init:
      - cd ../..
      - npm install --legacy-peer-deps
    gradle:
      - yes
    prebuild:
      - cd ../..
      - sed -i '/apply from.*sentry.gradle/d' android/app/build.gradle
      - sed -i '/jvmToolchain\|JavaVersion/s/17/21/' node_modules/@react-native/gradle-plugin/*/build.gradle.kts
        node_modules/@react-native/gradle-plugin/react-native-gradle-plugin/src/main/kotlin/com/facebook/react/utils/JdkConfiguratorUtils.kt
        node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle
      - printf '\nkotlin.jvm.target.validation.mode=warning\n' >> android/gradle.properties
      - sed -i '/firebase/d' node_modules/expo-notifications/android/build.gradle
      - cp -a fdroid/expo-notifications-patches/. node_modules/expo-notifications/android/src/main/java/
      - sed -i "s|implementation 'androidx.core:core:1.17.0'|implementation 'androidx.core:core:1.17.0'\n  implementation 'com.google.android.gms:play-services-tasks:18.0.2'|" node_modules/expo-notifications/android/build.gradle
      - sed -i '/installreferrer/d' node_modules/expo-application/android/build.gradle
      - cp -a fdroid/expo-application-patches/. node_modules/expo-application/android/src/main/java/expo/modules/application/
    scanignore:
      - node_modules/expo-modules-autolinking/scripts/android/autolinking_implementation.gradle
      - node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle
      - node_modules/react-native-safe-area-context/android/build.gradle
      - node_modules/react-native-screens/android/build.gradle
      - node_modules/react-native-svg/android/build.gradle
      - node_modules/react-native/ReactAndroid/publish.gradle
      - node_modules/react-native/sdks/hermesc/linux64-bin
    scandelete:
      - node_modules
    ndk: 27.1.12297006

