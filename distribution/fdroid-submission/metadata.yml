# Refreshed 2026-08-04: expo-notifications FCM patch recipe reworked and
# build-verified in WSL Ubuntu (same steps as Builds:.prebuild below). The
# module declares no FCM dependency in SDK 54+, so upstream cannot resolve
# com.google.firebase.messaging.*; the recipe installs shadow stubs at the
# package root (fdroid/expo-notifications-patches/com/...) that fail every
# FCM operation with a clear error, and adds the real play-services-tasks
# artifact (pure Java) so com.google.android.gms.tasks.Task resolves.
